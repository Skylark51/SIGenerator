name: Windows release build

on:
  push:
    branches:
      - main
      - 'feature/**'
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: win64_msvc2022_64
          cache: true

      - name: Configure Windows Release
        shell: pwsh
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR" -DSI_GENERATOR_OUTPUT_DIRECTORY="$env:GITHUB_WORKSPACE/dist"

      - name: Compile app and tests
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel 4

      - name: Run regression tests
        shell: pwsh
        run: |
          ctest --test-dir build -C Release --output-on-failure

      - name: Package Windows application
        shell: pwsh
        run: |
          & "$env:QT_ROOT_DIR/bin/windeployqt.exe" --release --no-translations --dir dist dist/SIGenerator.exe
          if ($LASTEXITCODE -ne 0) { throw "windeployqt failed" }
          Copy-Item README.md dist/README.md
          Compress-Archive -Path dist/* -DestinationPath SI-Generator-Windows-x64.zip -Force

      - name: Verify in-place Windows update
        shell: pwsh
        run: |
          $target = Join-Path $env:RUNNER_TEMP "si-patch-test"
          New-Item -ItemType Directory -Path $target -Force | Out-Null
          Copy-Item dist/SIGenerator.exe $target/
          Copy-Item dist/Qt6Core.dll $target/
          & ./native/update-local.ps1 -PackagePath ./SI-Generator-Windows-x64.zip -ProjectRoot $target
          if (-not (Test-Path (Join-Path $target "SIGenerator.exe"))) { throw "Patched EXE missing" }
          if (-not (Get-ChildItem (Join-Path $target "backups") -Directory -Filter "runtime-*" |
              Where-Object { Test-Path (Join-Path $_.FullName "SIGenerator.exe") })) {
            throw "Original EXE backup missing"
          }

      - name: Verify download-free local update command
        shell: pwsh
        run: |
          $target = Join-Path $env:RUNNER_TEMP "si-auto-update-test"
          New-Item -ItemType Directory -Path $target -Force | Out-Null
          Copy-Item dist/SIGenerator.exe $target/
          Copy-Item dist/Qt6Core.dll $target/
          git -C $target init | Out-Null
          git -C $target -c user.name=CI -c user.email=ci@example.com commit --allow-empty -m "test update" | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Git fixture setup failed" }
          $global:siMockHead = (& git -C $target rev-parse HEAD).Trim()
          $global:siMockZip = (Resolve-Path ./SI-Generator-Windows-x64.zip).Path

          function global:gh {
            if ($args[0] -eq "run" -and $args[1] -eq "list") {
              Write-Output ('[{"databaseId":123,"headSha":"' + $global:siMockHead + '"}]')
              $global:LASTEXITCODE = 0
              return
            }
            if ($args[0] -eq "run" -and $args[1] -eq "download") {
              $index = [array]::IndexOf($args, "-D")
              if ($index -lt 0) { throw "Mock download directory not specified" }
              Copy-Item -LiteralPath $global:siMockZip -Destination $args[$index + 1] -Force
              $global:LASTEXITCODE = 0
              return
            }
            throw "Unexpected gh command: $args"
          }

          try {
            & ./native/update-local.ps1 -ProjectRoot $target
          } finally {
            Remove-Item Function:/gh -ErrorAction SilentlyContinue
          }
          if (-not (Test-Path (Join-Path $target "SIGenerator.exe"))) {
            throw "Automatic update did not install the executable"
          }
          if (-not (Get-ChildItem (Join-Path $target "backups") -Directory -Filter "runtime-*" |
              Where-Object { Test-Path (Join-Path $_.FullName "SIGenerator.exe") })) {
            throw "Automatic update did not back up the old executable"
          }

      - name: Upload installable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: SI-Generator-Windows-x64
          path: SI-Generator-Windows-x64.zip
          if-no-files-found: error

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" SI-Generator-Windows-x64.zip --title "SI Generator ${{ github.ref_name }}" --generate-notes
