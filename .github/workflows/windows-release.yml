name: Windows release build

on:
  push:
    branches:
      - main
      - 'feature/**'
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: win64_msvc2022_64
          cache: true

      - name: Configure Windows Release
        shell: pwsh
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR" -DSI_GENERATOR_OUTPUT_DIRECTORY="$env:GITHUB_WORKSPACE/dist"

      - name: Compile app and tests
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel 4

      - name: Run regression tests
        shell: pwsh
        run: |
          ctest --test-dir build -C Release --output-on-failure

      - name: Package Windows application
        shell: pwsh
        run: |
          & "$env:QT_ROOT_DIR/bin/windeployqt.exe" --release --no-translations --dir dist dist/SIGenerator.exe
          if ($LASTEXITCODE -ne 0) { throw "windeployqt failed" }
          Copy-Item README.md dist/README.md
          Compress-Archive -Path dist/* -DestinationPath SI-Generator-Windows-x64.zip -Force

      - name: Upload installable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: SI-Generator-Windows-x64
          path: SI-Generator-Windows-x64.zip
          if-no-files-found: error

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" SI-Generator-Windows-x64.zip --title "SI Generator ${{ github.ref_name }}" --generate-notes
